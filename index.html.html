<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eu te acho ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
body{background:#fff;color:#35251e}
button,input{font:inherit}
#loginScreen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:50}
.login-card{width:min(390px,88vw);padding:42px 38px;background:#fff;border:1px solid #eee;box-shadow:0 14px 45px #00000012;border-radius:14px;text-align:center}
.login-card h1{font-size:28px;margin:0 0 8px}
.login-card p{margin:0 0 26px;color:#777;font-family:Arial,sans-serif;font-size:14px}
.field{position:relative;margin:12px 0}
.field input{width:100%;height:48px;border:1px solid #d9d2cd;border-radius:8px;padding:0 14px;outline:none}
.field input:focus{border-color:#9b7562}
.password-wrap input{padding-right:48px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:20px;color:#806c62}
#enterBtn{width:100%;height:48px;margin-top:10px;border:0;border-radius:8px;background:#49352c;color:white;cursor:pointer}
#enterBtn:hover{background:#38271f}
#error{height:20px;margin-top:10px;color:#d40000;font:14px Arial,sans-serif}

#room{position:fixed;inset:0;background:#6e4935;display:none;perspective:1000px}
#room.visible{display:block}
.wall{position:absolute;inset:0;background:
linear-gradient(90deg,#704d3b 0 49.7%,#634333 49.7% 50.3%,#704d3b 50.3%);
}
.wall:after{content:"";position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(90deg,transparent 0 75px,#3d281f 76px 78px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:32%;background:
repeating-linear-gradient(0deg,#7b5035 0 25px,#5d3a29 26px 28px),
repeating-linear-gradient(90deg,transparent 0 100px,#4b3024 101px 104px);
transform:perspective(600px) rotateX(55deg);transform-origin:bottom}
.curtain{position:absolute;top:0;bottom:28%;width:50%;background:
repeating-linear-gradient(90deg,#7d1020 0 24px,#a5162b 25px 48px,#6b0c18 49px 72px);
z-index:20;box-shadow:inset 0 0 45px #300009}
.curtain.left{left:0;border-right:3px solid #510713}
.curtain.right{right:0;border-left:3px solid #510713}
#room.open .curtain.left{animation:openLeft 1.7s cubic-bezier(.7,0,.2,1) forwards}
#room.open .curtain.right{animation:openRight 1.7s cubic-bezier(.7,0,.2,1) forwards}
@keyframes openLeft{to{transform:translateX(-100%)}}
@keyframes openRight{to{transform:translateX(100%)}}

.table{position:absolute;z-index:5;left:50%;bottom:20%;transform:translateX(-50%);width:290px;height:130px}
.tabletop{position:absolute;top:0;left:0;width:100%;height:35px;border-radius:12px;background:linear-gradient(#8b5c3e,#603c29);box-shadow:0 8px 10px #24130c99}
.leg{position:absolute;top:27px;width:22px;height:105px;background:#573724}
.leg.l{left:28px}.leg.r{right:28px}
.pot{position:absolute;z-index:10;left:50%;top:-105px;transform:translateX(-50%);width:95px;height:88px;border-radius:12px 12px 28px 28px;background:linear-gradient(90deg,#55392b,#9b6a49 48%,#4d3023);box-shadow:0 9px 10px #0006;cursor:pointer}
.pot:before{content:"";position:absolute;left:-6px;top:-9px;width:107px;height:22px;border-radius:50%;background:#4c2f22}
.pot:after{content:"✉ ✉ ✉";position:absolute;left:10px;right:10px;top:24px;text-align:center;color:#f4dfbd;font-size:19px;letter-spacing:2px}
.pot.open{animation:potOpen .55s forwards}
@keyframes potOpen{to{transform:translateX(-50%) translateY(-12px) rotate(-8deg)}}

.hint{position:absolute;z-index:8;bottom:5%;left:50%;transform:translateX(-50%);color:#f9eee7;font:14px Arial,sans-serif;text-shadow:0 2px 4px #000;text-align:center}
.letter{position:absolute;z-index:15;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);width:min(440px,80vw);min-height:260px;background:#fff9e9;padding:40px 36px;border-radius:3px;box-shadow:0 18px 45px #0008;cursor:pointer;text-align:center}
.letter.show{animation:letterIn .65s forwards}
@keyframes letterIn{to{transform:translate(-50%,-50%) scale(1)}}
.letter.open{animation:none}
.letter p{font-size:23px;line-height:1.45;margin:0;color:#49352d}
.letter .small{font:12px Arial,sans-serif;color:#a58a7c;margin-top:28px}
.heart{font-size:22px;margin-bottom:12px}
@keyframes fadeOut{to{opacity:0;transform:scale(.98)}}
</style>
</head>
<body>
<section id="loginScreen">
  <div class="login-card">
    <h1>Para entrar 💌</h1>
    <p>Tem uma pequena surpresa esperando por você.</p>
    <div class="field"><input id="name" type="text" placeholder="Nome" autocomplete="off"></div>
    <div class="field password-wrap">
      <input id="password" type="password" placeholder="Senha" autocomplete="off">
      <button class="eye" id="eye" type="button" aria-label="Mostrar senha">♡</button>
    </div>
    <button id="enterBtn">Entrar</button>
    <div id="error"></div>
  </div>
</section>

<section id="room">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="curtain left"></div>
  <div class="curtain right"></div>
  <div class="table">
    <div class="pot" id="pot" title="Clique no pote"></div>
    <div class="tabletop"></div><div class="leg l"></div><div class="leg r"></div>
  </div>
  <div class="letter" id="letter">
    <div class="heart">♡</div>
    <p id="message"></p>
    <div class="small">clique para guardar esta carta e receber outra</div>
  </div>
  <div class="hint" id="hint">A cortina vai se abrir... depois, clique no pote.</div>
</section>

<script>
const messages = [
"Eu te acho a calmaria no meio do caos.",
"Eu te acho a poesia que eu nunca soube escrever.",
"Eu te acho a resposta para as minhas preces.",
"Eu te acho a luz na escuridão.",
"Eu te acho um universo inteiro de coisas boas.",
"Eu te acho a tradução perfeita do que é amor.",
"Eu te acho uma obra de arte viva.",
"Eu te acho a parte mais bonita da minha rotina.",
"Eu te acho o destino para onde eu sempre quero voltar.",
"Eu te acho o meu porto seguro em mares agitados.",
"Eu te acho a minha paz interior.",
"Eu te acho o equilíbrio que faltava na minha vida.",
"Eu te acho uma constelação inteira.",
"Eu te acho a melodia mais harmoniosa.",
"Eu te acho o meu recomeço favorito.",
"Eu te acho o sentido do meu dia a dia.",
"Eu te acho a razão do meu peito ficar quentinho.",
"Eu te acho o melhor capítulo da minha história.",
"Eu te acho tudo o que eu sempre sonhei.",
"Eu te acho simplesmente perfeita.",
"Eu te acho a minha companhia de bagunça ideal.",
"Eu te acho a pessoa perfeita para dividirmos comida.",
"Eu te acho meu meme favorito em forma de gente.",
"Eu te acho um perigo de tão fofa.",
"Eu te acho a minha parceira perfeita de maratona de filmes.",
"Eu te acho a melhor conselheira.",
"Eu te acho a única pessoa capaz de me fazer rir em um dia ruim.",
"Eu te acho um raio de sol em dias nublados.",
"Eu te acho o meu café da manhã favorito.",
"Eu te acho a minha música preferida em repetição.",
"Eu te acho demais para o meu caminhãozinho.",
"Eu te acho uma caixinha de surpresas boas.",
"Eu te acho a minha pessoa de fofoca favorita.",
"Eu te acho meu combo perfeito.",
"Eu te acho a rainha do drama mais fofa.",
"Eu te acho o ingrediente secreto da minha felicidade.",
"Eu te acho o topo da minha lista de prioridades.",
"Eu te acho uma verdadeira joia rara.",
"Eu te acho o meu bilhete premiado da sorte.",
"Eu te acho a pessoa mais legal desse planeta.",
"Eu te acho linda de qualquer jeito.",
"Eu te acho o ser mais charmoso que existe.",
"Eu te acho maravilhosa até quando acorda.",
"Eu te acho estilosa demais.",
"Eu te acho dona do sorriso mais lindo.",
"Eu te acho elegante sem fazer esforço.",
"Eu te acho deslumbrante.",
"Eu te acho fotogênica ao extremo.",
"Eu te acho com um olhar hipnotizante.",
"Eu te acho naturalmente bonita.",
"Eu te acho fofa demais.",
"Eu te acho chique e classuda.",
"Eu te acho dona de um brilho único.",
"Eu te acho impecável.",
"Eu te acho cheia de graça.",
"Eu te acho linda sorrindo.",
"Eu te acho linda brava.",
"Eu te acho com um cabelo maravilhoso.",
"Eu te acho a definição de beleza.",
"Eu te acho radiante e vistosa.",
"Eu te acho a pessoa mais incrível que já conheci.",
"Eu te acho meu porto seguro.",
"Eu te acho meu lugar favorito no mundo.",
"Eu te acho perfeita do seu próprio jeito.",
"Eu te acho um presente na minha vida.",
"Eu te acho a minha melhor escolha.",
"Eu te acho apaixonante.",
"Eu te acho meu motivo para sorrir.",
"Eu te acho o amor da minha vida.",
"Eu te acho insubstituível.",
"Eu te acho encantadora.",
"Eu te acho fascinante.",
"Eu te acho um sonho feito realidade.",
"Eu te acho a minha pessoa favorita.",
"Eu te acho o meu maior acerto.",
"Eu te acho radiante.",
"Eu te acho meu lar.",
"Eu te acho doce e acolhedora.",
"Eu te acho irresistível.",
"Eu te acho meu abrigo nos dias difíceis.",
"Eu te acho simplesmente perfeita."
];

const login = document.getElementById('loginScreen');
const room = document.getElementById('room');
const nameInput = document.getElementById('name');
const passInput = document.getElementById('password');
const error = document.getElementById('error');
const eye = document.getElementById('eye');
const enter = document.getElementById('enterBtn');
const pot = document.getElementById('pot');
const letter = document.getElementById('letter');
const message = document.getElementById('message');
const hint = document.getElementById('hint');

eye.onclick = () => {
  passInput.type = passInput.type === 'password' ? 'text' : 'password';
  eye.textContent = passInput.type === 'password' ? '♡' : '♥';
};

function tryLogin(){
  if(nameInput.value === "Amor" && passInput.value === "20/05"){
    error.textContent = "";
    login.style.animation = "fadeOut .45s forwards";
    setTimeout(()=>{
      login.style.display="none";
      room.classList.add('visible');
      requestAnimationFrame(()=>room.classList.add('open'));
      setTimeout(()=>hint.textContent="Agora clique no pote para pegar uma carta.",1900);
    },450);
  } else {
    error.textContent = "senha incorreta";
  }
}
enter.onclick = tryLogin;
[nameInput,passInput].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==="Enter")tryLogin()}));

let index=0;
let stage=0; // 0 pote fechado, 1 carta disponível, 2 carta aberta

pot.onclick = e=>{
  e.stopPropagation();
  if(stage!==0)return;
  pot.classList.add('open');
  setTimeout(()=>{
    stage=1;
    hint.textContent="A carta saiu. Clique nela.";
    letter.classList.add('show');
    message.textContent=messages[index];
  },500);
};

letter.onclick = e=>{
  e.stopPropagation();

  // Primeira vez: abre a carta.
  if(stage===1){
    stage=2;
    hint.textContent="Clique novamente na carta para pegar outra.";
    return;
  }

  // Segunda vez: fecha a carta atual e traz a próxima.
  if(stage===2){
    index=(index+1)%messages.length;

    letter.classList.remove('show');
    letter.classList.remove('open');

    setTimeout(()=>{
      message.textContent=messages[index];
      stage=1;
      letter.classList.add('show');
      hint.textContent="Clique na carta para ler. Clique novamente para pegar outra.";
    },350);
  }
};

document.getElementById('room').addEventListener('click',(e)=>{
  if(e.target === pot || e.target === letter || letter.contains(e.target)) return;
  if(stage===0) pot.click();
  else if(stage===2) letter.click();
});
</script>
</body>
</html>
